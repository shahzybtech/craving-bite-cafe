<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Craving Bite Cafe</title><style>
:root{--b:#111;--g:#f4c400;--bg:#faf8f2;--line:#e9e6de}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#151515}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;display:flex;gap:10px;align-items:center}.logo{background:#111;color:#f4c400;padding:10px;border-radius:10px}.brand small{display:block;color:#888;font-size:8px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#111;color:#fff}.gold{background:#f4c400;color:#111;font-weight:900}.hero{background:#111;color:#fff;padding:50px 8%;display:flex;justify-content:space-between;align-items:center;min-height:390px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.9}.hero em{color:#f4c400;font-style:normal}.herofood{font-size:150px;width:290px;height:290px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#625300,#111 68%)}main{max-width:1100px;margin:auto;padding:25px 6% 90px}.search{display:flex;gap:8px}.search input{flex:1;padding:13px;border:1px solid #ddd;border-radius:10px}.cats{display:flex;gap:8px;overflow:auto;padding:15px 0}.cats button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:9px 15px;border-radius:20px}.cats .on{background:#111;color:#f4c400}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.pic{height:145px;background:linear-gradient(145deg,#181818,#555);display:grid;place-items:center;font-size:65px;position:relative}.best{position:absolute;top:8px;left:8px;background:#f4c400;font-size:9px;padding:5px;border-radius:5px;font-weight:bold}.info{padding:12px}.info h3{margin:0 0 5px;font-size:15px}.info p{font-size:11px;color:#777;min-height:28px}.add{float:right;border:0;background:#111;color:#f4c400;border-radius:8px;padding:8px}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:92vh;border-radius:20px 20px 0 0;padding:20px;overflow:auto}.close{float:right;border:0;border-radius:50%;padding:9px}.row{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.full{width:100%;padding:14px;border:0;border-radius:10px}.form input,.form select,.form textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:10;display:flex;justify-content:space-around;padding:9px}.nav button{border:0;background:none}.order{background:#fff;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0}.bar{height:7px;background:#eee;border-radius:20px}.bar i{display:block;height:100%;background:#f4c400}.pill{background:#eee;padding:5px 8px;border-radius:12px;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.herofood{width:190px;height:190px;font-size:110px}}@media(max-width:600px){.hero{padding:35px 6%;}.herofood{width:125px;height:125px;font-size:75px}.grid{gap:9px}.pic{height:120px}}
</style></head><body>
<header><div class="brand"><span class="logo">CB</span><span id="brand">CRAVING BITE<small>CAFE • MANSEHRA</small></span></div><button class="btn" onclick="openCart()">🛒 <b id="count">0</b></button></header>
<section class="hero"><div><small id="banner">FRESH • HOT • CRAVABLE</small><h1>Big flavor.<br><em>Zero compromise.</em></h1><p id="tagline">Fresh burgers, shawarma, fries & drinks.</p><button class="btn gold" onclick="document.querySelector('main').scrollIntoView()">ORDER NOW →</button></div><div class="herofood">🍔</div></section>
<main><div class="search"><input id="q" placeholder="Search menu..." oninput="render()"></div><div class="cats" id="cats"></div><div id="menu" class="grid"></div><section id="account" class="hidden"><h2>My Orders</h2><div id="orders"></div></section></main>
<nav class="nav"><button onclick="home()">🏠<br>Home</button><button onclick="openCart()">🛒<br>Cart</button><button onclick="showOrders()">📦<br>Orders</button><button onclick="contact()">💬<br>WhatsApp</button></nav>
<div id="cartM" class="modal hidden"><div class="sheet"><button class="close" onclick="closeCart()">✕</button><h2>Your Cart</h2><div id="cartItems"></div><div class="row"><b>Subtotal</b><b>Rs <span id="sub">0</span></b></div><div class="row"><b>Delivery</b><b>Rs <span id="fee">0</span></b></div><div class="row"><b>Total</b><b>Rs <span id="total">0</span></b></div><button class="full gold" onclick="checkout()">CHECKOUT</button></div></div>
<div id="checkM" class="modal hidden"><div class="sheet form"><button class="close" onclick="closeCheck()">✕</button><h2>Checkout</h2><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone"><select id="type" onchange="toggleAddr()"><option>Delivery</option><option>Pickup</option></select><textarea id="address" placeholder="Complete delivery address"></textarea><select id="payment"><option>Cash on Delivery</option><option>Bank Transfer</option><option>Cash on Pickup</option></select><div id="bank" class="pill hidden"></div><textarea id="note" placeholder="Order note"></textarea><input id="coupon" placeholder="Coupon code"><button class="full gold" onclick="place()">PLACE ORDER</button></div></div>
<div id="done" class="modal hidden"><div class="sheet" style="text-align:center"><h1>🎉</h1><h2>Order Received</h2><p id="doneText"></p><button class="full gold" onclick="closeDone();showOrders()">TRACK ORDER</button></div></div>
<script>
let cfg={settings:{},menu:[],coupons:[]},cat="All",cart=JSON.parse(localStorage.cbcCart||"[]"),orders=JSON.parse(localStorage.cbcOrders||"[]");
const $=x=>document.getElementById(x);
async function boot(){cfg=await fetch("/api/config").then(r=>r.json());brand.textContent=cfg.settings.cafeName;banner.textContent=cfg.settings.banner;tagline.textContent=cfg.settings.tagline;catsDraw();render();update();}boot();
function catsDraw(){let a=["All",...new Set(cfg.menu.map(x=>x.cat))];cats.innerHTML=a.map(x=>`<button class="${x===cat?"on":""}" onclick="cat='${x}';catsDraw();render()">${x}</button>`).join("")}
function render(){let q=$("q").value.toLowerCase(),a=cfg.menu.filter(x=>(cat==="All"||x.cat===cat)&&(!q||x.name.toLowerCase().includes(q)));menu.innerHTML=a.map(x=>`<article class="card"><div class="pic">${x.best?'<span class="best">BEST SELLER</span>':''}${x.emoji}</div><div class="info"><h3>${x.name}</h3><p>${x.desc}</p><b>Rs ${x.price}</b><button class="add" onclick="add(${x.id})">+ ADD</button></div></article>`).join("")}
function add(id){let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});save();update();toast("Added to cart")}function save(){localStorage.cbcCart=JSON.stringify(cart);localStorage.cbcOrders=JSON.stringify(orders)}function update(){count.textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){let a=cart.map(x=>({...cfg.menu.find(m=>m.id===x.id),qty:x.qty}));cartItems.innerHTML=a.length?a.map(x=>`<div class="row"><span>${x.name} × ${x.qty}</span><b>Rs ${x.price*x.qty}</b></div>`).join(""):"<p>Your cart is empty.</p>";let s=a.reduce((a,x)=>a+x.price*x.qty,0),d=a.length?cfg.settings.deliveryFee:0;sub.textContent=s;fee.textContent=d;total.textContent=s+d;cartM.classList.remove("hidden")}function closeCart(){cartM.classList.add("hidden")}
function checkout(){if(!cart.length)return toast("Cart is empty");closeCart();checkM.classList.remove("hidden");let p=JSON.parse(localStorage.cbcProfile||"{}");name.value=p.name||"";phone.value=p.phone||"";bank.textContent=`Bank: ${cfg.settings.bankName||"Not configured"} | Title: ${cfg.settings.accountTitle||""} | Account: ${cfg.settings.accountNumber||""} | IBAN: ${cfg.settings.iban||""}`}function closeCheck(){checkM.classList.add("hidden")}function toggleAddr(){address.style.display=type.value==="Pickup"?"none":"block"}
async function place(){let n=name.value.trim(),p=phone.value.trim(),a=address.value.trim(),items=cart.map(x=>({...cfg.menu.find(m=>m.id===x.id),qty:x.qty}));if(!n||!p||(type.value==="Delivery"&&!a))return toast("Complete your details");let s=items.reduce((a,x)=>a+x.price*x.qty,0),d=type.value==="Delivery"?cfg.settings.deliveryFee:0,discount=0,code=coupon.value.trim().toUpperCase(),cp=cfg.coupons.find(x=>x.code===code&&x.active);if(cp)discount=cp.type==="percent"?Math.round(s*cp.value/100):cp.value;let body={name:n,phone:p,type:type.value,address:a,payment:payment.value,note:note.value,items,sub:s,delivery:d,total:Math.max(0,s+d-discount),discount,coupon:code};let o=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());orders.unshift(o);cart=[];save();update();closeCheck();doneText.textContent=`${o.id} • Total Rs ${o.total}`;done.classList.remove("hidden");localStorage.cbcProfile=JSON.stringify({name:n,phone:p})}
function closeDone(){done.classList.add("hidden")}function showOrders(){account.classList.remove("hidden");menu.classList.add("hidden");cats.classList.add("hidden");ordersEl=orders;ordersDiv();window.scrollTo(0,250)}function ordersDiv(){orders.innerHTML=ordersEl.map(o=>`<div class="order"><div class="row"><b>${o.id}</b><span>${o.status}</span></div><p>${o.items.map(x=>x.name+" × "+x.qty).join(", ")}</p><div class="bar"><i style="width:${({Received:20,Preparing:40,Ready:60,"Out for Delivery":80,Delivered:100,Cancelled:0}[o.status]||20)}%"></i></div><small>Rs ${o.total}</small></div>`).join("")||"<p>No orders yet.</p>"}function home(){account.classList.add("hidden");menu.classList.remove("hidden");cats.classList.remove("hidden")}function contact(){let n=cfg.settings.whatsapp.replace(/\D/g,"");location.href="https://wa.me/"+n+"?text="+encodeURIComponent("Assalam o Alaikum, Craving Bite Cafe se rabta karna hai.")}function toast(t){alert(t)}
</script></body></html>
