<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBC Admin V5</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f4f4;color:#151515}header{background:#111;color:#fff;padding:17px 5%;display:flex;justify-content:space-between}header b{color:#fff}header small{color:#f4c400}nav{background:#fff;padding:10px 5%;display:flex;gap:7px;overflow:auto;border-bottom:1px solid #ddd}nav button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:9px 12px;white-space:nowrap}main{max-width:1100px;margin:auto;padding:25px 18px}.view{background:#fff;border-radius:15px;padding:20px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8f6f0;padding:16px;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:7px}.card{border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin:9px 0}.card button,.save,.add{background:#111;color:#fff;border:0;padding:8px 11px;border-radius:8px}.gold{background:#f4c400!important;color:#111!important}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-weight:bold}.formgrid input,.formgrid textarea,.formgrid select{width:100%;padding:11px;margin-top:5px;border:1px solid #ddd;border-radius:8px}.formgrid textarea{min-height:70px}.login{position:fixed;inset:0;background:#111;display:grid;place-items:center}.login>div{background:#fff;padding:30px;border-radius:18px;width:min(380px,90%);text-align:center}.login input{width:100%;padding:12px;margin:10px 0}.login button{width:100%;padding:12px;background:#f4c400;border:0;border-radius:8px;font-weight:bold}.hidden{display:none!important}.status{background:#fff0a6;padding:5px 8px;border-radius:6px;font-size:11px;float:right}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div><h2>Craving Bite Cafe</h2><p>Admin Panel V5</p><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">LOGIN</button><small>Default: cravingbiteadmin</small></div></div>
<div id="app" class="hidden"><header><b>CRAVING BITE <small>ADMIN V5</small></b><button onclick="location.reload()">Logout</button></header><nav><button onclick="tab('dashboard')">📊 Dashboard</button><button onclick="tab('settings')">⚙ Business Settings</button><button onclick="tab('menu')">🍔 Menu</button><button onclick="tab('orders')">🧾 Orders</button><button onclick="tab('coupons')">🎟 Coupons</button></nav><main>
<section id="dashboard" class="view"><h2>Dashboard</h2><div class="stats"><div class="stat">Orders<b id="ordersN">0</b></div><div class="stat">Sales<b id="salesN">Rs 0</b></div><div class="stat">Customers<b id="custN">0</b></div><div class="stat">Pending<b id="pendingN">0</b></div></div><div id="dashOrders"></div></section>
<section id="settings" class="view hidden"><h2>Business Settings</h2><p>Edit everything customers see. Save once and the customer app updates after refresh.</p><div class="formgrid">
<label>Cafe Name<input id="s_cafeName"></label><label>Tagline<input id="s_tagline"></label><label>Location<input id="s_location"></label><label>WhatsApp Number<input id="s_whatsapp" placeholder="923001234567"></label><label>Phone<input id="s_phone"></label><label>Delivery Fee<input id="s_delivery" type="number"></label><label>Opening Time<input id="s_opening"></label><label>Closing Time<input id="s_closing"></label><label>Bank Name<input id="s_bank"></label><label>Account Title<input id="s_title"></label><label>Account Number<input id="s_account"></label><label>IBAN<input id="s_iban"></label><label style="grid-column:1/-1">Home Banner Text<input id="s_banner"></label><label style="grid-column:1/-1">About Cafe<textarea id="s_about"></textarea></label>
</div><button class="save gold" onclick="saveSettings()">SAVE ALL SETTINGS</button></section>
<section id="menu" class="view hidden"><h2>Menu Management</h2><button class="add gold" onclick="addItem()">+ ADD ITEM</button><div id="menuList"></div></section>
<section id="orders" class="view hidden"><h2>Orders</h2><div id="orderList"></div></section>
<section id="coupons" class="view hidden"><h2>Coupons</h2><button class="add gold" onclick="addCoupon()">+ ADD COUPON</button><div id="couponList"></div></section>
</main></div>
<script>
let key=sessionStorage.cbcKey,data;
const $=id=>document.getElementById(id);
async function api(u,o={}){o.headers={...(o.headers||{}),"x-admin-key":key};let r=await fetch(u,o);if(r.status===401){logout()}return r.json()}
async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass.value})});if(!r.ok)return alert("Invalid password");let x=await r.json();key=x.key;sessionStorage.cbcKey=key;start()}
function logout(){sessionStorage.removeItem("cbcKey");location.reload()}
async function start(){login.classList.add("hidden");app.classList.remove("hidden");await refresh();dashboard()}
async function refresh(){data=await api("/api/admin/all")}
function tab(id){document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden");({dashboard,settings:settingsView,menu:menuView,orders:ordersView,coupons:couponView}[id])()}
async function dashboard(){await refresh();ordersN.textContent=data.orders.length;salesN.textContent="Rs "+data.orders.filter(x=>x.status!=="Cancelled").reduce((a,x)=>a+x.total,0);custN.textContent=data.customers.length;pendingN.textContent=data.orders.filter(x=>!["Delivered","Cancelled"].includes(x.status)).length;dashOrders.innerHTML=data.orders.slice(0,8).map(orderCard).join("")}
function orderCard(o){return `<div class="card"><b>${o.id}</b><span class="status">${o.status}</span><p>${o.name} • ${o.phone}<br>${o.items.map(x=>x.name+" × "+x.qty).join(", ")}<br><b>Rs ${o.total}</b></p></div>`}
function settingsView(){let s=data.settings;for(let k of ["cafeName","tagline","location","whatsapp","phone","deliveryFee","opening","closing","bankName","accountTitle","accountNumber","iban","banner","about"]){$("s_"+({accountTitle:"title",accountNumber:"account"}[k]||k)).value=s[k]||""}}
async function saveSettings(){let s={cafeName:s_cafeName.value,tagline:s_tagline.value,location:s_location.value,whatsapp:s_whatsapp.value,phone:s_phone.value,deliveryFee:Number(s_delivery.value),opening:s_opening.value,closing:s_closing.value,bankName:s_bank.value,accountTitle:s_title.value,accountNumber:s_account.value,iban:s_iban.value,banner:s_banner.value,about:s_about.value};await api("/api/admin/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)});await refresh();alert("All settings saved.")}
function menuView(){menuList.innerHTML=data.menu.map(x=>`<div class="card"><b>${x.emoji} ${x.name}</b><p>${x.cat} • Rs ${x.price}<br>${x.desc}</p><button onclick="editItem(${x.id})">Edit</button> <button onclick="toggle(${x.id})">${x.available?"Disable":"Enable"}</button> <button onclick="delItem(${x.id})">Delete</button></div>`).join("")}
async function addItem(){let name=prompt("Item name?");if(!name)return;let cat=prompt("Category?","Burgers"),price=Number(prompt("Price?","400")),emoji=prompt("Emoji?","🍔"),desc=prompt("Description?","Freshly prepared.");await api("/api/admin/menu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,cat,price,emoji,desc,available:true,best:false})});await refresh();menuView()}
async function editItem(id){let x=data.menu.find(x=>x.id==id),name=prompt("Name",x.name),price=prompt("Price",x.price),desc=prompt("Description",x.desc),cat=prompt("Category",x.cat);if(name)await api("/api/admin/menu/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,price:Number(price),desc,cat})});await refresh();menuView()}
async function toggle(id){let x=data.menu.find(x=>x.id==id);await api("/api/admin/menu/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({available:!x.available})});await refresh();menuView()}
async function delItem(id){if(confirm("Delete this item?")){await api("/api/admin/menu/"+id,{method:"DELETE"});await refresh();menuView()}}
function ordersView(){orderList.innerHTML=data.orders.map(o=>orderCard(o)+`<select onchange="status('${o.id}',this.value)"><option ${o.status==="Received"?"selected":""}>Received</option><option ${o.status==="Preparing"?"selected":""}>Preparing</option><option ${o.status==="Ready"?"selected":""}>Ready</option><option ${o.status==="Out for Delivery"?"selected":""}>Out for Delivery</option><option ${o.status==="Delivered"?"selected":""}>Delivered</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option></select>`).join("")||"<p>No orders.</p>"}
async function status(id,status){await api("/api/admin/orders/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});await refresh();ordersView();dashboard()}
function couponView(){couponList.innerHTML=data.coupons.map(c=>`<div class="card"><b>${c.code}</b><p>${c.type} • ${c.value} • ${c.active?"Active":"Inactive"}</p><button onclick="toggleCoupon(${c.id})">${c.active?"Disable":"Enable"}</button><button onclick="delCoupon(${c.id})">Delete</button></div>`).join("")}
async function addCoupon(){let code=prompt("Coupon code?");if(!code)return;let value=Number(prompt("Discount percent?","10"));await api("/api/admin/coupons",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code.toUpperCase(),type:"percent",value,active:true})});await refresh();couponView()}
async function toggleCoupon(id){let c=data.coupons.find(x=>x.id==id);await api("/api/admin/coupons/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:!c.active})});await refresh();couponView()}
async function delCoupon(id){if(confirm("Delete coupon?")){await api("/api/admin/coupons/"+id,{method:"DELETE"});await refresh();couponView()}}
if(key)start()
</script></body></html>
